<style>
:root{
  --rosa:#F7E3E5; --magenta:#DE0048; --giallo:#FFED00; --blu:#003E88; --nero:#121112;
  --carta:#fff; --testo:#121112; --tenue:#6C6062; --bordo:#E4CDD0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --rosa:#1C1C1F; --carta:#26262A; --testo:#F3EDEE; --tenue:#A9A0A2; --bordo:#3A3A40;
}
*{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--rosa);color:var(--testo);
  font-family:"Barlow Condensed",Arial,sans-serif;font-size:18px;line-height:1.35}
header{padding:14px 16px 8px;border-bottom:4px solid var(--nero);background:var(--rosa)}
:root[data-theme="dark"] header{border-color:var(--bordo)}
.occhiello{display:flex;justify-content:space-between;gap:12px;font-size:13px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--tenue);font-weight:600}
h1{font-family:Literata,Georgia,serif;font-size:clamp(26px,7.2vw,40px);margin:6px 0 2px;letter-spacing:-.02em}
.sotto{font-size:14px;color:var(--tenue);text-transform:uppercase;letter-spacing:.05em}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;gap:6px;overflow-x:auto;
  padding:8px 12px;background:var(--rosa);border-bottom:2px solid var(--bordo)}
nav button{flex:0 0 auto;border:2px solid var(--nero);background:var(--carta);color:var(--testo);
  font:600 15px/1 "Barlow Condensed",Arial,sans-serif;text-transform:uppercase;letter-spacing:.05em;
  padding:8px 14px;border-radius:999px;cursor:pointer}
:root[data-theme="dark"] nav button{border-color:var(--bordo)}
nav button[aria-current="true"]{background:var(--magenta);border-color:var(--magenta);color:#fff}
main{padding:14px 12px 30px;max-width:900px;margin:0 auto}
section{display:none}section.on{display:block}
.card{background:var(--carta);border:2px solid var(--bordo);border-radius:14px;padding:14px;margin-bottom:14px}
.tag{display:inline-block;background:var(--magenta);color:#fff;font-weight:700;font-size:12px;
  letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.tag.giallo{background:var(--giallo);color:var(--nero)}
h2{font-family:Literata,Georgia,serif;font-size:22px;margin:14px 2px 10px}
h3{font-size:21px;margin:8px 0 6px;letter-spacing:-.01em}
.cover{width:100%;border-radius:10px;border:1px solid var(--bordo);display:block}
.punti{list-style:none;margin:10px 0 0;padding:0}
.punti li{position:relative;padding-left:22px;margin-bottom:5px;font-size:17px}
.punti li:before{content:"";position:absolute;left:2px;top:8px;width:9px;height:9px;
  background:var(--magenta);border-radius:2px;transform:rotate(45deg)}
button.apri{width:100%;margin-top:12px;background:var(--nero);color:#fff;border:0;border-radius:10px;
  padding:12px;font:700 16px/1 "Barlow Condensed",Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.lista{display:grid;gap:10px}
.riga{display:flex;gap:10px;align-items:center;background:var(--carta);border:2px solid var(--bordo);
  border-radius:12px;padding:8px;text-align:left;width:100%;color:var(--testo);font-family:inherit;cursor:pointer}
.riga img{width:56px;height:74px;object-fit:cover;object-position:top;border-radius:6px;border:1px solid var(--bordo)}
.riga .t{font-weight:700;font-size:18px;line-height:1.1}
.riga .d{font-size:13px;color:var(--tenue);text-transform:uppercase;letter-spacing:.05em}
table{width:100%;border-collapse:collapse;background:var(--carta);border-radius:10px;overflow:hidden}
th{background:var(--blu);color:#fff;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
  padding:7px 6px;text-align:left}
td{padding:7px 6px;border-bottom:1px solid var(--bordo);font-size:17px}
td.n{text-align:center;font-weight:700;width:34px}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.primo td{background:var(--giallo);color:#121112;font-weight:700}
.mini{width:22px;height:22px;border-radius:50%;vertical-align:middle;margin-right:6px}
.vuoto{color:var(--tenue);margin:0}
/* impaginazione del numero */
.art{margin-top:4px}
.art .sez{display:flex;align-items:flex-start;gap:10px;margin:26px 0 10px}
.art .sez:first-child{margin-top:12px}
.art .sez .em{font-size:23px;line-height:1.1;flex:0 0 auto}
.art .sez .tx{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;
  font-size:23px;line-height:1.1;letter-spacing:-.01em;text-transform:uppercase}
.art .ap{font-family:Literata,Georgia,serif;font-size:17px;line-height:1.62;margin:0 0 12px}
.art .ap b{font-weight:600}
.art .rg{font-size:18px;line-height:1.5;margin:2px 0;display:flex;gap:8px;align-items:baseline}
.art .rg .em{flex:0 0 auto}
.art h4.vet{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;font-size:19px;
  text-transform:uppercase;letter-spacing:.02em;margin:16px 0 4px;color:var(--magenta)}
.art hr.ah{border:0;border-top:1px solid var(--bordo);margin:20px 0}
.banda{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
  border:2px solid var(--nero);border-radius:10px;padding:14px 10px;margin:6px 0 14px;background:var(--carta)}
:root[data-theme="dark"] .banda{border-color:var(--bordo)}
.banda .lt{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.banda .lt img{width:56px;height:56px;border-radius:50%}
.banda .lt span{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;font-size:16px;line-height:1.1}
.banda .ct{display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 6px}
.banda .gol{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;font-size:34px;
  line-height:1;color:var(--magenta);white-space:nowrap}
.banda .vs{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;font-size:24px;color:var(--tenue)}
.banda .fp{font-size:13px;color:var(--tenue);white-space:nowrap}
.premi{display:grid;gap:8px;margin:18px 0 4px}
.premio{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--bordo);
  border-radius:12px;padding:10px 12px;background:var(--carta)}
.premio .em{font-size:20px;flex:0 0 auto}
.premio .et{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;font-size:15px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--magenta);display:block}
.premio .vl{font-size:17px;line-height:1.4}
.squadra{display:flex;align-items:center;gap:10px}
.squadra img{width:46px;height:46px;border-radius:50%}
.pill{display:inline-block;border:1px solid var(--bordo);border-radius:999px;padding:2px 9px;
  font-size:14px;margin:2px 4px 2px 0;color:var(--tenue)}
.rosa{margin-top:10px;display:none}
.rosa.on{display:block}
.rosa .rep{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--magenta);
  font-weight:700;margin:8px 0 3px}
.rosa .g{display:flex;justify-content:space-between;border-bottom:1px dotted var(--bordo);padding:3px 0;font-size:16px}
.gr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:6px 0;
  border-bottom:1px solid var(--bordo);font-size:15px}
.gr:last-of-type{border-bottom:0}
.gr .a,.gr .b{display:flex;align-items:center;gap:6px;min-width:0}
.gr .a{justify-content:flex-end;text-align:right}
.gr .mini{width:22px;height:22px;flex:none;margin:0}
.gr .vinto span{font-weight:700}
.gr .ris{font-weight:700;white-space:nowrap}
.gvai{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;
  background:var(--magenta);color:#fff;border:0;border-radius:10px;padding:12px 16px;width:100%;
  font:inherit;font-weight:700;font-size:17px;cursor:pointer;text-align:left}
.gvai span{font-size:22px;line-height:1}
.mini-cl{margin:0 0 12px}
.mini-cl h3{font-size:16px;margin:0 0 6px}
.mini-cl .r1{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:15px;border-bottom:1px solid var(--bordo)}
.mini-cl .r1:last-child{border-bottom:0}
.mini-cl .r1 .p{width:16px;color:var(--tenue);font-size:13px}
.mini-cl .r1 .nm{flex:1}
.mini-cl .r1 .mini{width:20px;height:20px}
.chiudi{background:var(--magenta);color:#fff;border:0;border-radius:10px;padding:10px 16px;
  font:700 15px/1 "Barlow Condensed",Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px;cursor:pointer}
footer{text-align:center;padding:18px 12px 26px;color:var(--tenue);font-size:14px}
.credito{margin-top:24px;font-size:11px;line-height:1.4;text-align:left;opacity:.55}
.credito a{color:inherit;text-decoration:none}
.credito a:hover{text-decoration:underline}
:root[data-theme="dark"] .credito{opacity:.7}
footer button{background:none;border:2px solid var(--bordo);color:var(--tenue);border-radius:999px;
  padding:8px 16px;font:600 14px/1 "Barlow Condensed",Arial,sans-serif;text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
</style>
</head>

HhPRgJWdjpTVlwbQAOgEDIpDslxyCnpyOs65MQgUbYYNLbetVvW+TpgQhhkI5gT+IsAcxL/AJEVpZt8UEiUcBAA4A0ZPRgJWdjpTVlwbQAOgEDB45DTrR0uedjLgqICjbOr5vPiAQEdI9cAAAAcBlhKCWb8VFA7KHP/8Aiv8A/9k=", "testo": "⏳ *LA LEGA C'È, MANCA SOLO UNA SERA*\n\nDieci squadre iscritte, app installata, calendario sorteggiato, regolamento chiuso, *1.000 crediti* a testa pronti da bruciare. C'è tutto. Manca una cosa sola: una sera in cui ci siamo tutti.\n\n_Non è mai stato un problema di voglia. È un problema di agenda._\n\n━━━━━━━━━━━━━\n\n🏟️ *LE DIECI AL VIA*\n\n*Al Fonso FC 1982* · *Hellas Madonna* · *Iachini Fc* · *Mariolone62* · *Messi Male* · *Montegiove* · *One Pisa* · *PescaraManzia* · *SS santa petronilla blm* · *atletico al bar*\n\nDentro c'è di tutto: veterani che il fanta lo masticano da anni, una coppia padre e figlio, e chi si siede al tavolo di un'asta per la prima volta in vita sua. _Ed è proprio quello il bello: nessuno parte favorito, perché nessuno sa ancora niente degli altri._\n\n━━━━━━━━━━━━━\n\n📋 *ISTRUZIONI PER L'USO · COSA CONTA IN QUESTA LEGA*\n\nModalità *Classic*, *1.000 crediti*, e una scelta che cambia tutto: *nessun modificatore attivo*. Niente difesa, niente portiere, niente capitano. Contano solo gli undici fantavoti dei titolari, sommati e basta.\n\nIl primo gol scatta a *66 punti*, poi una fascia ogni *4*: 66 uno, 70 due, 74 tre, 78 quattro. Fasce strette, punteggi larghi, pochissimi pareggi. E siccome un gol vero vale *+3*, un attaccante che ne mette due ti sposta il risultato quasi di una fascia intera da solo.\n\n_Tradotto per chi è alla prima asta: dietro si spende il minimo indispensabile, davanti si spende tutto. Rigoristi e centrocampisti da bonus sono la valuta di questa lega._\n\n━━━━━━━━━━━━━\n\n📉 *IL CASO · IL SONDAGGIO INFINITO*\n\nDue sondaggi, nove opzioni, tre conferme e tre rinvii. Il venerdì è pieno, il sabato è pieno, la domenica pure. Abbiamo scoperto che mettere d'accordo dieci persone su una sera è più difficile che prendere *Lautaro* a 150 crediti.\n\nSiamo arrivati al punto di dover disdire pure gli *arrosticini*, e questo, dalle nostre parti, è il segnale che la situazione va raddrizzata. _Il bello è che la voglia c'è ancora tutta: serve solo qualcuno che dica una data e la tenga._\n\n━━━━━━━━━━━━━\n\n🏆 *MVP DELLA VIGILIA* · *Messi Male* · non ha mai mollato di un centimetro\n😴 *FLOP DELLA VIGILIA* · *il calendario di settembre* _(imbattibile, per ora)_\n⚔️ *LA SFIDA DA SEGUIRE* · _trovare una sera. Solo una._\n\n━━━━━━━━━━━━━\n\n📅 *E ADESSO · LA DATA CHE NON SI SPOSTA*\n\nQuesta è l'unica scadenza che non dipende da noi. La lega parte dalla *6ª giornata di Serie A*, che si apre *sabato 10 ottobre alle ore 15.00* con *Genoa - Fiorentina* e si chiude *lunedì 12* con *Torino - Udinese*.\n\n_Ci vediamo una sera sola in tutto l'anno, e da quella sera dipendono otto mesi di sfottò. Scegliamo la data e chiudiamola._"}, {"num": 0.5, "speciale": true, "data": "8 ottobre 2026", "titolo": "Il listone è cambiato", "sommario": "Tre settimane di sosta sono bastate a rimescolare le carte: chi sale, chi si è fermato in nazionale e le tre panchine nuove. Il punto su come sono cambiate le prospettive d'asta, per arrivare al tavolo con la lista pronta.", "punti": ["Malen capocannoniere con 6 gol, il ginocchio non preoccupa", "Raimondo fermo per il tendine d'Achille, tempi da valutare", "Vergara, Jones e Zaniolo: circa un mese di stop secondo i giornali", "Tre panchine nuove: Vanoli, Palladino e Gilardino"], "cover": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wgARCAdXBDgDASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAUGAwQHAgEI/8QAGwEBAQEBAQEBAQAAAAAAAAAAAAECAwQGBQf/2gAMAwEAAhADEAAAAejDPYAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAaBvtbybbV9mdpYSTauc9tT4bjzrm0x6RIgAAAAAAAAAAAAAAPOIzmqbQD4PoADHkDHkAADHkAB8PoDH7PoAAAAAA const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const SQ = {};
LEGA.squadre.forEach(s => {
  SQ[s.id] = Object.assign({}, s, {
    logo: LOGHI[s.id] || "",
    top: s.rosa.slice().sort((a,b) => b.c - a.c).slice(0, 4)
  });
});
const nomeSq = k => SQ[k] ? SQ[k].nome : k;
const fx = v => Number.isInteger(v) ? String(v) : String(Math.round(v * 100) / 100);
const vuoto = t => `<div class="card"><p class="vuoto">${esc(t)}</p></div>`;

/* ============================================================
   CALCOLI DERIVATI DALLE GIORNATE E DALLE FORMAZIONI
   ============================================================ */
const SOGLIA = 66, FASCIA = 4;
function golDa(p){ return p < SOGLIA ? 0 : Math.floor((p - SOGLIA) / FASCIA) + 1; }

function classifica(){
  const t = {};
  LEGA.squadre.forEach(s => t[s.id] = {k:s.id, g:0, v:0, n:0, p:0, pt:0, gf:0, gs:0, tot:0});
  LEGA.giornate.forEach(g => g.partite.forEach(m => {
    const a = t[m.c], b = t[m.t];
    if (!a || !b) return;
    a.g++; b.g++;
    a.gf += m.gc; a.gs += m.gt; b.gf += m.gt; b.gs += m.gc;
    a.tot += m.pc; b.tot += m.pt;
    if (m.gc > m.gt){ a.pt += 3; a.v++; b.p++; }
    else if (m.gc < m.gt){ b.pt += 3; b.v++; a.p++; }
    else { a.pt++; b.pt++; a.n++; b.n++; }
  }));
  Object.values(t).forEach(r => r.tot = Math.round(r.tot * 10) / 10);
  return Object.values(t).sort((x,y) =>
    y.pt - x.pt || (y.gf - y.gs) - (x.gf - x.gs) || y.tot - x.tot);
}

function prestazioni(){
  const r = [];
  LEGA.giornate.forEach(g => g.partite.forEach(p => {
    r.push({sq:p.c, punti:p.pc, gf:p.gc, gs:p.gt, avv:p.t, n:g.n});
    r.push({sq:p.t, punti:p.pt, gf:p.gt, gs:p.gc, avv:p.c, n:g.n});
  }));
  return r;
}

const conVoto = x => x.v !== null && x.v !== undefined;

  const l = [];
  LEGA.formazioni.forEach(f => f.titolari.forEach(x => {
    if (conVoto(x)) l.push({g:x.g, s:f.s, v:x.v, n:f.n});
  }));
  return l.concat(LEGA.fantavoti);
}

/* panchinari con voto rimasti fuori dal punteggio */
function votiPanchina(){
  const l = [];
  LEGA.formazioni.forEach(f => (f.panchina || []).forEach(x => {
    if (conVoto(x) && !x.entrato) l.push({g:x.g, s:f.s, v:x.v, n:f.n});
  }));
  return l;
}

/* punti lasciati in panchina: ruolo per ruolo con il modulo schierato,
   titolare peggiore contro panchinaro migliore finché il panchinaro supera.
   I subentrati d'ufficio contano come in campo. */
function puntiLasciati(f){
  let tot = 0;
  ["P","D","C","A"].forEach(r => {
    const campo = f.titolari.filter(x => x.r === r && conVoto(x))
      .concat((f.panchina || []).filter(x => x.r === r && conVoto(x) && x.entrato))
      .map(x => x.v).sort((a,b) => a - b);
    const panca = (f.panchina || []).filter(x => x.r === r && conVoto(x) && !x.entrato)
      .map(x => x.v).sort((a,b) => b - a);
    for (let k = 0; k < Math.min(campo.length, panca.length); k++){
      if (panca[k] > campo[k]) tot += panca[k] - campo[k]; else break;
    }
  });
  return Math.round(tot * 10) / 10;
}

/* l'n-esima giornata corrisponde all'n-esimo numero post-giornata (speciali esclusi) */
function uscitaGiornata(n){
  const post = LEGA.uscite.filter(u => !u.speciale).sort((a,b) => a.num - b.num);
  return post[n-1] || null;
}

function mvpGiornata(n){
  const l = votiTitolari().filter(x => x.n === n);
  if (!l.length) return "";
  const max = Math.max(...l.map(x => x.v));
  return l.filter(x => x.v === max).map(x =>
    `<b>${esc(x.g)}</b> (${esc(nomeSq(x.s))}) con ${fx(x.v)}`).join(" · ");
}

function vistaTop11(top){
  const f = LEGA.formazioni.find(x => x.s === top.sq && x.n === top.n);
  if (!f) return vuoto("Servono i tabellini completi della formazione con il punteggio più alto.");
  const s = SQ[top.sq];
  const ris = top.gf > top.gs ? "vittoria" : top.gf < top.gs ? "sconfitta" : "pareggio";
  const rep = {P:"Portiere", D:"Difesa", C:"Centrocampo", A:"Attacco"};
  const vv = v => (v !== null && v !== undefined) ? fx(v) : "sv";
  let out = "";
  ["P","D","C","A"].forEach(r => {
    const gio = f.titolari.filter(x => x.r === r);
    if (!gio.length) return;
    out += `<div class="rep">${rep[r]}</div>` + gio.map(x =>
      `<div class="g"><span>${esc(x.g)}</span><span><b>${vv(x.v)}</b></span></div>`).join("");
  });
  const panca = f.panchina || [];
  out += `<div class="rep">In panchina</div>` + (panca.length ? panca.map(x =>
    `<div class="g"><span>${esc(x.g)}${x.entrato ? " (entrato)" : ""}</span><span>${vv(x.v)}</span></div>`).join("")
    : `<div class="g"><span style="color:var(--tenue)">nessuno</span><span></span></div>`);
  const cv = f.titolari.filter(conVoto);
  const best = cv.slice().sort((a,b) => b.v - a.v)[0];
  const sopra7 = cv.filter(x => x.v >= 7).length;
  const pBest = panca.filter(x => conVoto(x) && !x.entrato).sort((a,b) => b.v - a.v)[0];
  let cur = best ? `Curiosità: il trascinatore è stato ${best.g} con ${fx(best.v)}, e ${sopra7} titolari su ${f.titolari.length} hanno chiuso dal 7 in su` : "";
  if (cur && pBest && pBest.v >= 7) cur += `; in panchina era rimasto anche ${pBest.g} con ${fx(pBest.v)}`;
  return `<div class="card" style="border-left:8px solid ${s.colore}">
    <div class="squadra"><img src="${s.logo}" alt="">
      <span><h3 style="margin:0">${esc(s.breve)} · ${fx(top.punti)} punti</h3>
      <span class="d" style="color:var(--tenue)">${top.n}ª giornata · ${ris} ${top.gf} - ${top.gs} contro
      ${esc(SQ[top.avv].breve)} · modulo ${esc(f.modulo)}</span></span></div>
    <div class="rosa on" style="margin-top:8px">${out}</div>
    <p style="margin:10px 0 0;color:var(--tenue);font-size:16px">La formazione con il punteggio più alto finora.${cur ? " " + esc(cur) + "." : ""}</p></div>`;
}

/* ============================================================
   IMPAGINAZIONE DEI NUMERI
   ============================================================ */
const EMO = /^((?:[0-9#*]️?⃣)|(?:\p{Extended_Pictographic}(?:️|‍\p{Extended_Pictographic})*))\s+(.*)$/u;
const PREMI = ["\u{1F3C6}", "\u{1F634}", "⚔", "\u{1F4B0}", "\u{1F4C9}"];
function senzaMark(s){ return String(s).replace(/[*_]/g, ""); }
function tuttoMaiusc(s){
  const t = senzaMark(s);
  return /[A-ZÀ-ÖØ-Þ]/.test(t) && t === t.toLocaleUpperCase("it");
}
function inline(s){
  return esc(s).replace(/\*([^*\n]+)\*/g, "<b>$1</b>").replace(/_([^_\n]+)_/g, "<i>$1</i>");
}
function chiaveSq(nome){
  const n = senzaMark(nome).toLowerCase().replace(/[^a-zà-ù0-9 ]/g, "").replace(/\s+/g, " ").trim();
  if (!n) return null;
  let best = null, len = 0;
  Object.keys(SQ).forEach(k => {
    [SQ[k].nome, SQ[k].breve].forEach(v => {
      const c = v.toLowerCase().replace(/[^a-zà-ù0-9 ]/g, "").replace(/\s+/g, " ").trim();
      if ((n === c || n.indexOf(c) >= 0 || c.indexOf(n) >= 0) && c.length > len){ best = k; len = c.length; }
    });
  });
  return best;
}
function banda(a, b, gc, gt, pc, pt){
  const ka = chiaveSq(a), kb = chiaveSq(b);
  const lato = (k, f) => `<div class="lt">${k ? `<img src="${SQ[k].logo}" alt="">` : ""}
    <span>${esc(k ? SQ[k].breve : senzaMark(f))}</span></div>`;
  const ct = (gc === null)
    ? `<span class="vs">vs</span>`
    : `<span class="gol">${gc} - ${gt}</span>` + (pc === null ? "" : `<span class="fp">${pc} · ${pt}</span>`);
  return `<div class="banda">${lato(ka, a)}<div class="ct">${ct}</div>${lato(kb, b)}</div>`;
}
function articolo(testo){
  const righe = String(testo).split("\n");
  let k = 0;
  if (righe[0] && righe[0].indexOf("\u{1F4F0}") === 0) k = 2;
  const out = [];
  let para = [], premi = [];
  const chiudiPara = () => {
    if (para.length){ out.push(`<p class="ap">${inline(para.join(" "))}</p>`); para = []; }
  };
  const chiudiPremi = () => {
    if (premi.length){ out.push(`<div class="premi">${premi.join("")}</div>`); premi = []; }
  };
  const R = /^(.+?)\s+(\d+)\s*-\s*(\d+)\s+(.+?)\s*\(\s*([\d.,]+)\s*-\s*([\d.,]+)\s*\)\s*$/;
  const V = /^(.{2,40}?)\s+vs\s+(.{2,40}?)\s*$/i;
  for (let n = k; n < righe.length; n++){
    const r = righe[n].trim();
    if (!r){ chiudiPara(); continue; }
    if (/^[━─-]{3,}$/.test(r)){ chiudiPara(); chiudiPremi(); out.push('<hr class="ah">'); continue; }
    const m = r.match(EMO);
    if (m){
      const em = m[1], resto = m[2].trim();
      if (PREMI.indexOf(em.replace(/️/g, "")) >= 0 && resto.indexOf("·") > 0 && !tuttoMaiusc(resto)){
        chiudiPara();
        const q = resto.split("·");
        premi.push(`<div class="premio"><span class="em">${em}</span><span>
          <span class="et">${esc(senzaMark(q.shift()).trim())}</span>
          <span class="vl">${inline(q.join("·").trim())}</span></span></div>`);
        continue;
      }
      chiudiPara(); chiudiPremi();
      if (tuttoMaiusc(resto)){
        out.push(`<div class="sez"><span class="em">${em}</span><span class="tx">${esc(senzaMark(resto))}</span></div>`);
      } else {
        out.push(`<div class="rg"><span class="em">${em}</span><span>${inline(resto)}</span></div>`);
      }
      continue;
    }
    const plain = senzaMark(r);
    const mr = plain.match(R);
    if (mr && chiaveSq(mr[1]) && chiaveSq(mr[4])){
      chiudiPara(); chiudiPremi();
      out.push(banda(mr[1], mr[4], mr[2], mr[3], mr[5], mr[6]));
      continue;
    }
    const mv = plain.match(V);
    if (mv && chiaveSq(mv[1]) && chiaveSq(mv[2])){
      chiudiPara(); chiudiPremi();
      out.push(banda(mv[1], mv[2], null, null, null, null));
      continue;
    }
    if (!para.length && r.length < 52 && righe[n+1] && righe[n+1].trim()){
      chiudiPremi();
      out.push(`<h4 class="vet">${inline(r)}</h4>`);
      continue;
    }
    para.push(r);
  }
  chiudiPara(); chiudiPremi();
  return `<div class="art">${out.join("")}</div>`;
}
function vistaNumero(n){
  const u = LEGA.uscite.find(x => x.num === n);
  if (!u) return;
  $("sec-numero").innerHTML = `<button class="chiudi" id="indietro">Torna indietro</button>
    <div class="card"><span class="tag">${etichetta(u)}</span>
      <span class="pill">${esc(u.data)}</span>
      <h3 style="margin-top:8px">${esc(u.titolo)}</h3>
      <img class="cover" src="${u.cover}" alt="Copertina" style="margin:10px 0">
      ${articolo(u.testo)}</div>`;
}

/* ============================================================
   NAVIGAZIONE
   ============================================================ */
const SEZIONI = [["prima","Prima pagina"],["archivio","Archivio"],["giornate","Giornate"],["classifica","Classifica"],
                 ["statistiche","Statistiche"],["squadre","Squadre"],["mercato","Mercato"]];
let sezioneCorrente = "prima";
function esisteNumero(n){ return LEGA.uscite.some(u => u.num === n); }
function leggiHash(h){
  h = String(h || "").replace(/^#/, "").trim();
  if (!h) return {sez:"prima"};
  const m = h.match(/^n(\d+(?:[.,]\d+)?)$/i);
  if (m){
    const n = parseFloat(m[1].replace(",", "."));
    return esisteNumero(n) ? {sez:"numero", num:n} : {sez:"prima", ripiego:true};
  }
  if (SEZIONI.some(([id]) => id === h)) return {sez:h};
  return {sez:"prima", ripiego:true};
}
function indirizzo(sez, n){ return sez === "numero" ? "#n" + n : "#" + sez; }
function mostra(sez, push, n){
  document.querySelectorAll("section").forEach(s => s.classList.remove("on"));
  const el = $("sec-" + sez);
  if (!el) return mostra("prima", push);
  el.classList.add("on");
  document.querySelectorAll("#nav button").forEach(b =>
    b.setAttribute("aria-current", b.dataset.sez === sez ? "true" : "false"));
  if (sez !== "numero") sezioneCorrente = sez;
  window.scrollTo(0, 0);
  if (push) history.pushState({sez:sez, num:(n === undefined ? null : n)}, "", indirizzo(sez, n));
}
function rendi(st){
  if (st.sez === "numero"){ vistaNumero(st.num); mostra("numero", false, st.num); }
  else mostra(st.sez, false);
}
function init(){
  $("hLega").textContent = LEGA.nome;
  $("hAgg").textContent = "Aggiornato al " + LEGA.aggiornato;
  $("hSotto").textContent = "Stagione " + LEGA.stagione + " · archivio delle uscite";
  $("piede").textContent = "Archivio ufficiale della " + LEGA.nome + " · stagione " + LEGA.stagione;
  $("nav").innerHTML = SEZIONI.map(([id,t]) =>
    `<button data-sez="${id}"${id==="prima"?' aria-current="true"':""}>${t}</button>`).join("");
  vistaPrima(); vistaArchivio(); vistaGiornate(); vistaClassifica(); vistaStatistiche(); vistaSquadre(); vistaMercato();

  document.addEventListener("click", e => {
    const nav = e.target.closest("#nav button");
    if (nav){ mostra(nav.dataset.sez, true); return; }
    const apri = e.target.closest("[data-num]");
    if (apri){
      const n = parseFloat(apri.dataset.num);
      vistaNumero(n); mostra("numero", true, n);
      return;
    }
    const rosa = e.target.closest("[data-rosa]");
    if (rosa){ $("rosa-" + rosa.dataset.rosa).classList.toggle("on"); return; }
    if (e.target.id === "indietro"){ history.back(); return; }
    if (e.target.id === "tema"){
      const scuro = document.documentElement.getAttribute("data-theme") === "dark";
      document.documentElement.setAttribute("data-theme", scuro ? "light" : "dark");
      e.target.textContent = scuro ? "Tema scuro" : "Tema chiaro";
    }
  });
  window.addEventListener("popstate", ev => {
    const st = (ev.state && ev.state.sez) ? {sez:ev.state.sez, num:ev.state.num} : leggiHash(location.hash);
    rendi(st);
  });
  window.addEventListener("hashchange", () => {
    const st = leggiHash(location.hash);
    if (st.ripiego){ history.replaceState({sez:"prima", num:null}, "", "#prima"); }
    rendi(st);
  });
  document.documentElement.setAttribute("data-theme", "light");
  const st = leggiHash(location.hash);
  if (st.sez === "numero"){
    sezioneCorrente = "archivio";
    history.replaceState({sez:"archivio", num:null}, "", "#archivio");
    history.pushState({sez:"numero", num:st.num}, "", "#n" + st.num);
    rendi(st);
  } else {
    history.replaceState({sez:st.sez, num:null}, "", "#" + st.sez);
    rendi(st);
  }
}
init();
</script>
