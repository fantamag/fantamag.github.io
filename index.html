<style>
:root{
  color-scheme: light;
  --carta:#F7E3E5; --magenta:#DE0048; --giallo:#FFED00; --blu:#003E88;
  --nero:#121112; --bianco:#ffffff; --grigio:#6C6062; --linea:#E0C9CC;
  --sfondo:var(--carta); --testo:var(--nero); --scheda:#ffffff;
  --tenue:var(--grigio); --bordo:var(--linea); --testata:var(--nero);
}
html[data-tema="scuro"]{
  color-scheme: dark;
  --sfondo:#2B2B2E; --testo:#F2ECED; --scheda:#37373B;
  --tenue:#B3A9AB; --bordo:#4A4A50; --testata:#F2ECED;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--sfondo); color:var(--testo);
  font-family:'Barlow Condensed',Arial,sans-serif; font-size:18px; line-height:1.35;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:900px;margin:0 auto;padding:0 12px 30px}

/* ---------- testata ---------- */
header.testata{padding:14px 0 8px;text-align:center;border-bottom:4px solid var(--testata)}
.occhiello{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--tenue);font-weight:600}
h1.logo{
  font-family:Literata,Georgia,serif;font-weight:700;
  font-size:clamp(26px,7.2vw,40px);line-height:1.08;margin:6px 0 6px;
  color:var(--testata);letter-spacing:-.02em;
}
.sottotestata{font-size:13px;color:var(--tenue);letter-spacing:.06em;text-transform:uppercase;font-weight:600}

/* ---------- navigazione ---------- */
nav{position:sticky;top:0;z-index:20;background:var(--sfondo);margin-bottom:18px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0 7px}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;border:2px solid var(--testo);background:var(--scheda);color:var(--testo);
  font-family:inherit;font-size:15px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;padding:8px 14px;border-radius:999px;cursor:pointer;
  white-space:nowrap;line-height:1;
}
.tab[aria-selected="true"]{background:var(--magenta);border-color:var(--magenta);color:#fff}
.scorri{height:3px;background:var(--bordo);border-radius:2px;overflow:hidden}
.scorri span{
  display:block;height:100%;background:var(--magenta);border-radius:2px;
  width:var(--largo,40%);transform:translateX(var(--sposta,0));
}

/* ---------- blocchi ---------- */
section[hidden]{display:none}
.titolo-sez{
  font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--magenta);
  font-weight:700;margin:26px 0 10px;display:flex;align-items:center;gap:10px;
}
.titolo-sez::after{content:"";flex:1;height:2px;background:var(--bordo)}
.scheda{background:var(--scheda);border:2px solid var(--bordo);border-radius:14px;padding:14px;margin-bottom:14px}
.vuoto{
  background:var(--scheda);border:2px dashed var(--bordo);border-radius:14px;
  padding:22px 16px;text-align:center;color:var(--tenue);
}
.vuoto strong{display:block;color:var(--testo);font-size:19px;margin-bottom:5px}
.mini{font-size:14px;color:var(--tenue)}

/* ---------- prima pagina ---------- */
.cover{width:100%;display:block;border:1px solid var(--bordo);border-radius:8px}
.cover-wrap{margin:0 0 16px}
.etichetta{
  display:inline-block;background:var(--magenta);color:#fff;font-weight:700;
  font-size:13px;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:4px;
}
h2.titolone{font-size:clamp(22px,5.6vw,30px);line-height:1.08;margin:9px 0 7px;color:var(--magenta);font-weight:700;text-transform:uppercase}
.sommario{font-family:Literata,Georgia,serif;font-size:16px;line-height:1.55}
ul.punti{list-style:none;padding:0;margin:14px 0 0}
ul.punti li{position:relative;padding-left:22px;margin-bottom:7px;font-size:16px}
ul.punti li::before{content:"✓";position:absolute;left:0;color:var(--magenta);font-weight:700}
.bottone{
  display:inline-block;background:var(--nero);color:#fff;border:none;border-radius:999px;
  font-family:inherit;font-size:15px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  padding:10px 18px;margin-top:14px;cursor:pointer;text-decoration:none;
}
html[data-tema="scuro"] .bottone{background:var(--magenta)}
.bottone.chiaro{background:transparent;color:var(--testo);border:2px solid var(--bordo)}

/* ---------- archivio ---------- */
.archivio{display:grid;gap:12px}
.voce{
  display:flex;gap:12px;align-items:flex-start;background:var(--scheda);
  border:2px solid var(--bordo);border-radius:14px;padding:12px;cursor:pointer;
  text-align:left;font-family:inherit;color:inherit;width:100%;
}
.voce img{width:76px;height:auto;border:1px solid var(--bordo);border-radius:4px;flex:0 0 auto}
.voce .num{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--magenta);font-weight:700}
.voce h3{margin:3px 0 3px;font-size:19px;line-height:1.12;text-transform:uppercase}
.voce p{margin:0;font-size:14px;color:var(--tenue)}

/* ---------- lettore ---------- */
#lettore{position:fixed;inset:0;background:var(--sfondo);z-index:40;overflow-y:auto;-webkit-overflow-scrolling:touch}
#lettore .barra{
  position:sticky;top:0;background:var(--sfondo);border-bottom:2px solid var(--bordo);
  display:flex;align-items:center;gap:12px;padding:10px 16px;
}
#lettore .barra strong{font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.chiudi{
  border:none;background:var(--nero);color:#fff;border-radius:999px;width:34px;height:34px;
  font-size:18px;line-height:1;cursor:pointer;flex:0 0 auto;font-family:inherit;
}
html[data-tema="scuro"] .chiudi{background:var(--magenta)}
.articolo{font-family:Literata,Georgia,serif;font-size:16px;line-height:1.55}
.articolo h3{
  font-family:'Barlow Condensed',sans-serif;font-size:21px;text-transform:uppercase;
  letter-spacing:.02em;margin:20px 0 7px;color:var(--magenta);line-height:1.15;
}
.articolo p{margin:0 0 12px}
.articolo hr{border:none;border-top:2px solid var(--bordo);margin:20px 0}
.articolo .premio{
  font-family:'Barlow Condensed',sans-serif;font-size:16px;background:var(--scheda);
  border-left:4px solid var(--magenta);padding:8px 12px;margin:0 0 8px;border-radius:0 6px 6px 0;
}

/* ---------- tabelle ---------- */
table{width:100%;border-collapse:collapse;background:var(--scheda);border-radius:14px;overflow:hidden}
thead th{background:var(--blu);color:#fff;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:8px 8px;text-align:left}
tbody td{padding:8px 8px;border-top:1px solid var(--bordo);font-size:16px}
tbody tr:first-child td{border-top:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.primo{background:rgba(222,0,72,.08)}

/* ---------- schedina risultati ---------- */
.schedina{background:var(--scheda);border:2px solid var(--bordo);border-radius:14px;overflow:hidden;margin-bottom:12px}
.riga-sq{display:flex;align-items:center;gap:10px;padding:10px 12px}
.riga-sq + .riga-sq{border-top:1px solid var(--bordo)}
.riga-sq img{width:28px;height:28px;flex:0 0 auto}
.riga-sq .nome{flex:1;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.riga-sq .gol{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.riga-sq.vince .nome,.riga-sq.vince .gol{color:var(--magenta)}
.riga-sq .fp{font-size:13px;color:var(--tenue);font-variant-numeric:tabular-nums}

/* ---------- squadre ---------- */
.griglia-sq{display:grid;gap:10px}
.card-sq{display:flex;gap:12px;align-items:center;background:var(--scheda);border:2px solid var(--bordo);border-radius:14px;padding:12px}
.card-sq img{width:42px;height:42px;flex:0 0 auto}
.card-sq .n{display:block;font-size:18px;font-weight:600;line-height:1.15}
.card-sq .m{display:block;font-size:14px;color:var(--tenue);line-height:1.3;margin-top:2px}
.card-sq > span:last-child{min-width:0}
.barra-col{width:5px;align-self:stretch;border-radius:3px;flex:0 0 auto}

/* ---------- statistiche in attesa ---------- */
ol.attesa{margin:0;padding-left:22px;color:var(--tenue)}
ol.attesa li{margin-bottom:5px;font-size:15px}

footer{border-top:2px solid var(--bordo);margin-top:28px;padding-top:16px;text-align:center;color:var(--tenue);font-size:14px}
footer .bottone{margin-top:10px}

.credito {
  margin-top: 24px;
  font-size: 11px;
  line-height: 1.4;
  text-align: left;
  opacity: .55;
}
.credito a { color: inherit; text-decoration: none; }
.credito a:hover { text-decoration: underline; }
html[data-tema="scuro"] .credito { opacity: .7; }
#lettore .credito{color:var(--tenue);margin-bottom:24px}
</style>
</head>

/* ============================================================
   UTILITA
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const sq = id => LEGA.squadre.find(s => s.id === id) || {nome:id, breve:id, colore:"#999"};
const logo = id => LOGHI[id] || "";
const num = n => String(n).replace(".", ",");

function inline(t){
  return esc(t)
    .replace(/\*([^*]+)\*/g, "<strong>$1</strong>")
    .replace(/_([^_]+)_/g, "<em>$1</em>");
}

/* trasforma il testo in stile WhatsApp in HTML leggibile */
function formatta(testo){
  const out = [];
  for (let riga of testo.split("\n")){
    riga = riga.trim();
    if (!riga) continue;
    if (/^[━─-]{3,}$/.test(riga)) { out.push("<hr>"); continue; }
    if (/^[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{23F0}-\u{23FF}]/u.test(riga)){
      if (/^[🏆😴⚔️]/u.test(riga)) { out.push(`<p class="premio">${inline(riga)}</p>`); continue; }
      out.push(`<h3>${inline(riga)}</h3>`);
      continue;
    }
    out.push(`<p>${inline(riga)}</p>`);
  }
  return out.join("");
}

/* ============================================================
   CALCOLI DERIVATI DALLE GIORNATE
   ============================================================ */
function classifica(){
  const t = {};
  LEGA.squadre.forEach(s => t[s.id] = {id:s.id, pt:0, v:0, n:0, p:0, gf:0, gs:0, fp:0, g:0});
  LEGA.giornate.forEach(g => (g.partite || []).forEach(m => {
    const a = t[m.c], b = t[m.t];
    if (!a || !b) return;
    a.g++; b.g++;
    a.gf += m.gc; a.gs += m.gt; b.gf += m.gt; b.gs += m.gc;
    a.fp += m.pc; b.fp += m.pt;
    if (m.gc > m.gt){ a.pt += 3; a.v++; b.p++; }
    else if (m.gc < m.gt){ b.pt += 3; b.v++; a.p++; }
    else { a.pt++; b.pt++; a.n++; b.n++; }
  }));
  return Object.values(t).sort((x,y) =>
    y.pt - x.pt || (y.gf - y.gs) - (x.gf - x.gs) || y.fp - x.fp);
}

function tuttePartite(){
  const r = [];
  LEGA.giornate.forEach(g => (g.partite || []).forEach(m => r.push({g, m})));
  return r;
}

/* soglie gol: primo gol a 66, poi una fascia ogni 4 */
const SOGLIA = 66, FASCIA = 4;
function golDa(p){ return p < SOGLIA ? 0 : Math.floor((p - SOGLIA) / FASCIA) + 1; }
function mancante(p){
  const prossima = p < SOGLIA ? SOGLIA : SOGLIA + FASCIA * golDa(p);
  return Math.round((prossima - p) * 100) / 100;
}

}

    h += `<button class="bottone" data-apri="${u.num}">Leggi il numero</button>`;
  }
  h += `<div class="titolo-sez">Il prossimo turno</div>`;
  h += `<div class="scheda"><div class="n" style="font-size:21px;font-weight:600">${p.giornata}ª di lega · ${p.serieA}ª di Serie A</div>
        <div class="mini" style="margin-top:4px">Si gioca ${esc(p.quando)}</div>
        <p style="margin:10px 0 0">${esc(p.nota)}</p></div>`;
  if (LEGA.asta.stato !== "conclusa"){
    h += `<div class="titolo-sez">L'asta</div>`;
    h += `<div class="scheda"><p style="margin:0">${esc(LEGA.asta.nota)}</p></div>`;
  }
  return h;
}

function renderArchivio(){
  if (!LEGA.uscite.length) return vuoto("Archivio vuoto", "Il primo numero deve ancora uscire.");
  const voci = [...LEGA.uscite].sort((a,b) => b.num - a.num).map(u => `
    <button class="voce" data-apri="${u.num}">
      <img src="${u.cover}" alt="">
      <span>
        <span class="num">Numero ${num(u.num)} · ${esc(u.data)}</span>
        <h3>${esc(u.titolo)}</h3>
        <p>${esc(u.tipo)}</p>
      </span>
    </button>`).join("");
  return `<div class="titolo-sez">Tutti i numeri</div><div class="archivio">${voci}</div>`;
}

function renderClassifica(){
  if (!LEGA.giornate.length){
    return `<div class="titolo-sez">Classifica</div>` +
      vuoto("Non si è ancora giocato",
        `La classifica compare dopo la prima giornata di lega, in programma ${LEGA.prossimo.quando}.`) +
      `<div class="titolo-sez">Le dieci al via</div><div class="griglia-sq">` +
      LEGA.squadre.map(s => `
        <div class="card-sq"><span class="barra-col" style="background:${s.colore}"></span>
          <img src="${logo(s.id)}" alt=""><span><span class="n">${esc(s.nome)}</span></span></div>`).join("") +
      `</div>`;
  }
  const c = classifica();
  const righe = c.map((r,i) => {
    const s = sq(r.id);
    return `<tr${i === 0 ? ' class="primo"' : ''}>
      <td class="num">${i+1}</td>
      <td><img src="${logo(r.id)}" alt="" style="width:24px;height:24px;vertical-align:-6px;margin-right:7px">${esc(s.breve)}</td>
      <td class="num">${r.pt}</td>
      <td class="num">${r.gf} - ${r.gs}</td>
      <td class="num">${num(r.fp.toFixed(1))}</td>
    </tr>`;
  }).join("");
  return `<div class="titolo-sez">Classifica</div>
    <table><thead><tr><th class="num">#</th><th>Squadra</th><th class="num">Pt</th>
    <th class="num">Gol</th><th class="num">Fantapunti</th></tr></thead><tbody>${righe}</tbody></table>`;
}

function renderRisultati(g){
  return (g.partite || []).map(m => {
    const a = sq(m.c), b = sq(m.t);
    const va = m.gc > m.gt, vb = m.gt > m.gc;
    const riga = (s, gol, fp, vince) => `
      <div class="riga-sq${vince ? ' vince' : ''}">
        <img src="${logo(s.id)}" alt="">
        <span class="nome">${esc(s.breve)}</span>
        <span class="fp">${num(fp.toFixed(1))}</span>
        <span class="gol">${gol}</span>
      </div>`;
    return `<div class="schedina">${riga(a, m.gc, m.pc, va)}${riga(b, m.gt, m.pt, vb)}</div>`;
  }).join("");
}

const ELENCO_STAT = [
  "I record: punteggio più alto e più basso",
  "I fantavoti più alti",
  "Le panchine d'oro",
  "Gli acquisti più cari dell'asta",
  "Gli affari dell'asta",
  "Gli acquisti da rivedere",
  "Il miglior presidente",
  "Il miglior fantallenatore",
  "Per un soffio: quanto è mancato al gol successivo",
  "Il termometro delle soglie"
];

function renderStatistiche(){
  let h = `<div class="titolo-sez">Statistiche</div>`;
  if (!LEGA.giornate.length){
    h += vuoto("Ancora nessun dato",
      "Le statistiche si calcolano da sole a partire dalla prima giornata giocata.");
    h += `<div class="scheda"><div class="mini" style="margin-bottom:8px">Quello che troverai qui:</div>
      <ol class="attesa">${ELENCO_STAT.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>`;
    return h;
  }
  const tutte = tuttePartite();
  const punteggi = [];
  tutte.forEach(({g,m}) => {
    punteggi.push({id:m.c, p:m.pc, g:g.n});
    punteggi.push({id:m.t, p:m.pt, g:g.n});
  });
  punteggi.sort((a,b) => b.p - a.p);
  const alto = punteggi[0], basso = punteggi[punteggi.length - 1];
  h += `<div class="scheda"><div class="titolo-sez" style="margin-top:0">I record</div>
    <p style="margin:0">Punteggio più alto: <strong>${esc(sq(alto.id).breve)}</strong>, ${num(alto.p.toFixed(1))} alla ${alto.g}ª.<br>
    Punteggio più basso: <strong>${esc(sq(basso.id).breve)}</strong>, ${num(basso.p.toFixed(1))} alla ${basso.g}ª.</p></div>`;

  const soffio = punteggi.map(x => ({...x, manca: mancante(x.p)}))
    .sort((a,b) => a.manca - b.manca).slice(0, 5);
  h += `<div class="scheda"><div class="titolo-sez" style="margin-top:0">Per un soffio</div>
    <table><tbody>${soffio.map(x => `<tr><td>${esc(sq(x.id).breve)} <span class="mini">(${x.g}ª)</span></td>
    <td class="num">${num(x.p.toFixed(1))}</td><td class="num">mancava ${num(x.manca.toFixed(1))}</td></tr>`).join("")}
    </tbody></table></div>`;
  return h;
}

function renderSquadre(){
  let h = `<div class="titolo-sez">Le dieci squadre</div><div class="griglia-sq">`;
  h += LEGA.squadre.map(s => `
    <div class="card-sq">
      <span class="barra-col" style="background:${s.colore}"></span>
      <img src="${logo(s.id)}" alt="">
      <span>
        <span class="n">${esc(s.nome)}</span>
        <span class="m">${esc(s.motto)}${s.spesi === null ? " · rosa non ancora assegnata" : ` · ${s.spesi} crediti spesi`}</span>
      </span>
    </div>`).join("");
  h += `</div>`;
  if (LEGA.squadre.every(s => !s.rosa.length)){
    h += vuoto("Rose ancora vuote",
      "Le rose complete, con il prezzo pagato per ogni giocatore, compaiono qui subito dopo l'asta.");
  }
  h += `<div class="titolo-sez">Il regolamento</div>`;
  h += `<table><tbody>${LEGA.regolamento.map(([a,b]) =>
    `<tr><td>${esc(a)}</td><td class="num">${esc(b)}</td></tr>`).join("")}</tbody></table>`;
  return h;
}

function renderMercato(){
  let h = `<div class="titolo-sez">Mercato</div>`;
  if (!LEGA.mercato.aperto){
    h += vuoto("Mercato non ancora aperto",
      "Finché l'asta non è stata disputata non c'è nulla da scambiare. Qui finiranno date, regole e operazioni concluse.");
    return h;
  }
  h += `<div class="scheda"><p style="margin:0">${esc(LEGA.mercato.date)}</p></div>`;
  if (LEGA.mercato.regole.length){
    h += `<div class="scheda"><ul class="punti">${LEGA.mercato.regole.map(r => `<li>${esc(r)}</li>`).join("")}</ul></div>`;
  }
  if (LEGA.mercato.operazioni.length){
    h += `<table><tbody>${LEGA.mercato.operazioni.map(o =>
      `<tr><td>${esc(o)}</td></tr>`).join("")}</tbody></table>`;
  } else {
    h += vuoto("Nessuna operazione", "Non è ancora stato concluso nessuno scambio.");
  }
  return h;
}

/* ============================================================
   NAVIGAZIONE
   ============================================================ */
const SEZIONI = ["prima","archivio","classifica","statistiche","squadre","mercato"];
const RENDER = {
  prima: renderPrima, archivio: renderArchivio, classifica: renderClassifica,
  statistiche: renderStatistiche, squadre: renderSquadre, mercato: renderMercato
};
let sezioneCorrente = "prima";
let apertoDaDentro = false;

function mostraSezione(nome, scrollSu){
  if (!SEZIONI.includes(nome)) nome = "prima";
  sezioneCorrente = nome;
  SEZIONI.forEach(s => {
    const el = document.getElementById("sez-" + s);
    if (s === nome){ el.innerHTML = RENDER[s](); el.hidden = false; }
    else { el.hidden = true; }
  });
  let attiva = null;
  document.querySelectorAll(".tab").forEach(t => {
    const sel = t.dataset.sez === nome;
    t.setAttribute("aria-selected", sel ? "true" : "false");
    if (sel) attiva = t;
  });
  if (attiva) attiva.scrollIntoView({block:"nearest", inline:"nearest"});
  aggiornaBarra();
  if (scrollSu) window.scrollTo(0, 0);
}

/* barra di scorrimento sotto le voci del menu */
function aggiornaBarra(){
  const t = document.querySelector(".tabs"), b = $("#scorri-barra");
  if (!t || !b) return;
  const quota = t.clientWidth / t.scrollWidth;
  if (quota >= 1){ b.style.setProperty("--largo", "100%"); b.style.setProperty("--sposta", "0px"); return; }
  const largo = t.clientWidth * quota;
  const corsa = t.clientWidth - largo;
  const avanti = t.scrollWidth - t.clientWidth;
  b.style.setProperty("--largo", largo.toFixed(1) + "px");
  b.style.setProperty("--sposta", (corsa * (t.scrollLeft / avanti)).toFixed(1) + "px");
}
document.querySelector(".tabs").addEventListener("scroll", aggiornaBarra, {passive:true});
window.addEventListener("resize", aggiornaBarra);

function apriNumero(n, scrollSu){
  const u = LEGA.uscite.find(x => String(x.num) === String(n));
  if (!u) return false;
  $("#lettore-tit").textContent = "Numero " + num(u.num) + " · " + u.tipo;
  $("#lettore-corpo").innerHTML =
    `<span class="etichetta">${esc(u.data)}</span>
     <h2 class="titolone">${esc(u.titolo)}</h2>
     <div class="cover-wrap"><img class="cover" src="${u.cover}" alt="Copertina del numero ${u.num}"></div>
     ${formatta(u.testo)}`;
  $("#lettore").hidden = false;
  document.body.style.overflow = "hidden";
  if (scrollSu) $("#lettore").scrollTop = 0;
  return true;
}

function chiudiNumero(){
  $("#lettore").hidden = true;
  document.body.style.overflow = "";
}

function applica(){
  const h = (location.hash || "").replace(/^#/, "").trim();
  const mNum = h.match(/^n(\d+(?:\.\d+)?)$/i);
  if (mNum){
    if (apriNumero(mNum[1], true)) return;
    location.replace("#prima");
    return;
  }
  chiudiNumero();
  if (h && !SEZIONI.includes(h)){ location.replace("#prima"); return; }
  mostraSezione(h || "prima", true);
}

/* ---- eventi ---- */
document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => { location.hash = t.dataset.sez; });
});

document.addEventListener("click", e => {
  const b = e.target.closest("[data-apri]");
  if (!b) return;
  apertoDaDentro = true;
  location.hash = "n" + b.dataset.apri;
});

function tornaIndietro(){
  if (apertoDaDentro){ apertoDaDentro = false; history.back(); }
  else { location.hash = "archivio"; }
}
$("#chiudi").addEventListener("click", tornaIndietro);
$("#indietro").addEventListener("click", tornaIndietro);

window.addEventListener("hashchange", applica);

$("#tema").addEventListener("click", () => {
  const scuro = document.documentElement.dataset.tema === "scuro";
  document.documentElement.dataset.tema = scuro ? "chiaro" : "scuro";
  $("#tema").textContent = scuro ? "Tema scuro" : "Tema chiaro";
  document.querySelector('meta[name="theme-color"]')
    .setAttribute("content", scuro ? "#F7E3E5" : "#2B2B2E");
});

/* ---- avvio ---- */
$("#agg").textContent = "Aggiornato al " + LEGA.aggiornato;
apertoDaDentro = false;
applica();
</script>
